# CityMap PostgreSQL configuration (local and CI environments).
listen_addresses = '*'
port = 5432
max_connections = 100

shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 128MB

wal_level = replica
max_wal_size = 1GB

log_destination = 'stderr'
# Keep slow queries visible in the pod log. 250ms is above a healthy indexed
# point lookup and below the queries that stall the whole site.
log_min_duration_statement = 250
log_line_prefix = '%m [%p] %q%u@%d '

datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
