# Quick local run without Kubernetes (development convenience only).
# The supported environment is the k3d cluster: see README.md.
services:
  postgis:
    build: ./db
    environment:
      POSTGRES_DB: citymap
      POSTGRES_USER: citymap
      POSTGRES_PASSWORD: citymap-dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgres://citymap:citymap-dev@postgis:5432/citymap
      REDIS_URL: redis://redis:6379
      JWT_SECRET: compose-dev-only
    ports: ["3000:3000"]
    depends_on: [postgis, redis]

  martin:
    image: ghcr.io/maplibre/martin:1.16.1
    command: ["--config", "/config.yaml"]
    environment:
      DATABASE_URL: postgres://citymap:citymap-dev@postgis:5432/citymap
    volumes: ["./tiles/config.yaml:/config.yaml:ro"]
    ports: ["3001:3000"]
    depends_on: [postgis]

  publisher:
    build: ./services/publisher
    profiles: [publish]
    environment:
      DATABASE_URL: postgres://citymap:citymap-dev@postgis:5432/citymap
    depends_on: [postgis]

volumes:
  pgdata:
