apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - prometheus-config.yaml
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: grafana-dashboard-citymap-json
    files:
      - citymap-api.json=grafana-dashboard.json
generatorOptions:
  disableNameSuffixHash: true
