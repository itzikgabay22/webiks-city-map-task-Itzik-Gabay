apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: citymap-api
        metrics_path: /metrics
        kubernetes_sd_configs:
          - namespaces:
              names: [citymap]
            role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: citymap-api
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: kubernetes
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [citymap]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
  alerts.yml: |
    groups:
      - name: citymap-wakeup
        rules:
          # Wake-up #1: the API is serving errors at a rate that will break
          # announcement day and partner integrations.
          - alert: CityMapHighErrorRate
            expr: |
              (
                sum(rate(citymap_http_requests_total{status_class="5xx"}[2m]))
                /
                clamp_min(sum(rate(citymap_http_requests_total[2m])), 0.001)
              ) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "CityMap API 5xx rate > 5%"
              description: "More than 5% of API requests are failing. Partners and the map will look down."

          # Wake-up #2: map clicks / summaries are too slow — the symptom behind R1/R2.
          - alert: CityMapHighLatency
            expr: |
              histogram_quantile(
                0.95,
                sum by (le, route) (rate(citymap_http_request_duration_seconds_bucket{route=~"/features/.*|/layers/:id/summary"}[5m]))
              ) > 1
            for: 3m
            labels:
              severity: critical
            annotations:
              summary: "CityMap p95 latency > 1s on click/summary routes"
              description: "Interactive map paths are degraded. Check PostGIS load and coastal geometry queries."

          - alert: CityMapApiDown
            expr: up{job="citymap-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "CityMap API scrape target is down"
              description: "Prometheus cannot scrape citymap-api. Confirm pods and /metrics."
