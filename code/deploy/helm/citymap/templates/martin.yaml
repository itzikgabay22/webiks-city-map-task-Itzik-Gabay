apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-martin
  labels: {{- include "citymap.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- required "martin.config is required" .Values.martin.config | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-martin
  labels: {{- include "citymap.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: martin
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-martin
  labels: {{- include "citymap.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.martin.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: martin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: martin
        {{- include "citymap.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.martin.config | sha256sum }}
    spec:
      containers:
        - name: martin
          image: {{ include "citymap.image" .Values.images.martin }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["--config", "/etc/martin/config.yaml"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: db-password
            - name: DATABASE_URL
              value: {{ include "citymap.databaseUrl" . | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/martin
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-martin
