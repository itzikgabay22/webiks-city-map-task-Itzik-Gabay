apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgis
  labels: {{- include "citymap.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: postgis
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgis
  labels: {{- include "citymap.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgis
        {{- include "citymap.labels" . | nindent 8 }}
    spec:
      containers:
        - name: postgis
          image: {{ include "citymap.image" .Values.images.postgis }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgis.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgis.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgis.user }}", "-d", "{{ .Values.postgis.database }}"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgis.user }}", "-d", "{{ .Values.postgis.database }}"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{- toYaml .Values.postgis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgis.storage }}
