apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "citymap.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "citymap.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        {{- include "citymap.labels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: {{ include "citymap.image" .Values.images.api }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: PORT
              value: "{{ .Values.api.port }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: db-password
            - name: DATABASE_URL
              value: {{ include "citymap.databaseUrl" . | quote }}
            - name: REDIS_URL
              value: redis://{{ .Release.Name }}-redis:6379
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: jwt-secret
            {{- range $name, $value := .Values.api.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.readinessPath }}
              port: http
            periodSeconds: {{ .Values.api.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.livenessPath }}
              port: http
            periodSeconds: {{ .Values.api.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.failureThreshold }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "citymap.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
