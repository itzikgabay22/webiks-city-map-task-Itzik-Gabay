# Martin tile server: vector tiles for the public data layers.
# District outlines are part of the static basemap and are not served here.
listen_addresses: '0.0.0.0:3000'
worker_processes: 4
cache_size_mb: 256

postgres:
  connection_string: ${DATABASE_URL}
  pool_size: 20
  auto_publish: false
  tables:
    parcels:
      schema: public
      table: parcels
      srid: 4326
      geometry_column: geom
      geometry_type: POLYGON
      minzoom: 12
      properties:
        parcel_code: text
        land_use: text
    announcements:
      schema: public
      table: announcements
      srid: 4326
      geometry_column: geom
      geometry_type: GEOMETRY
      properties:
        kind: text
        title: text
        dataset_version: text
